name: build
on:
  repository_dispatch:
    types: [build]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/build.sh
        env:
          BUILD_SECRET: ${{ secrets.BUILD_SECRET }}
